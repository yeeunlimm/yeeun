<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>서울 팝업 후보 분석 · ML 흐름도</title>
<style>
:root{--paper:#fff;--ink:#262b31;--muted:#66717a;--line:#c9ced1;--panel:#fbfbfa;--soft:#f4f5f4;--accent:#e96b5b;--accent-bg:#fff4f1;--green:#72bd8b;--blue:#547da5}*{box-sizing:border-box}body{margin:0;background:#f2f3f2;color:var(--ink);font-family:"Noto Sans KR","Malgun Gothic",sans-serif}.wrap{max-width:1500px;margin:28px auto;padding:0 20px}.sheet{background:var(--paper);border:1px solid #d5d8d9;border-radius:14px;padding:34px 40px 24px}.eyebrow{font:700 11px/1.2 Arial,sans-serif;letter-spacing:.14em;color:#858d91;text-transform:uppercase}.head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}.head h1{font-size:26px;letter-spacing:-.04em;margin:9px 0 5px}.head p{font-size:13px;color:var(--muted);margin:0}.badge{border:1px solid var(--line);border-radius:20px;padding:8px 12px;font-size:11px;color:var(--muted);white-space:nowrap}svg{width:100%;height:auto;display:block}.panel{fill:var(--panel);stroke:#aeb4b7;stroke-width:1.3}.node{fill:white;stroke:#aeb4b7;stroke-width:1.2}.focal{fill:var(--accent-bg);stroke:var(--accent);stroke-width:1.8}.softbox{fill:var(--soft);stroke:#d6dadb;stroke-width:1}.line{fill:none;stroke:#9aa2a6;stroke-width:1.7;marker-end:url(#arrow)}.line-accent{fill:none;stroke:var(--accent);stroke-width:2.2;marker-end:url(#arrowAccent)}.t{font-size:15px;font-weight:700;fill:var(--ink)}.s{font-size:12px;fill:var(--muted)}.tiny{font-size:10.5px;fill:var(--muted)}.tag{font-size:10px;font-weight:700;letter-spacing:.08em;fill:#707a7e}.num{font-size:11px;font-weight:700;fill:var(--accent)}.foot{border-top:1px solid #e1e4e4;margin-top:9px;padding-top:14px;display:flex;justify-content:space-between;gap:18px;color:#66717a;font-size:11px}.foot strong{color:var(--ink)}@media(max-width:800px){.wrap{padding:0;margin:0}.sheet{border-radius:0;padding:20px 14px}.head{display:block}.badge{display:inline-block;margin-top:12px}.foot{display:block}.foot span{display:block;margin:6px 0}}
</style>
</head>
<body><main class="wrap"><section class="sheet">
<header class="head"><div><div class="eyebrow">SEOUL POP-UP · MODEL PIPELINE</div><h1>주변 유동인구 범위 예측 흐름</h1><p>공개 생활인구로 학습한 후보 권역 모델의 데이터·비교·검증 과정을 요약했습니다.</p></div><div class="badge">3년 학습 · 최근 1주 최종 테스트</div></header>
<svg viewBox="0 0 1360 700" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
<title id="title">서울 팝업 후보 유동인구 ML 모델 흐름도</title><desc id="desc">서울 생활인구와 과거 예보 날씨, 달력 변수를 시간대별 권역 데이터로 합쳐 기준선, Poisson 회귀, 분위수 회귀를 비교하고, 최근 한 주로 평가한 뒤 전체 자료로 재학습합니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#9aa2a6"/></marker><marker id="arrowAccent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#e96b5b"/></marker></defs>
<!-- source cards -->
<rect class="panel" x="28" y="35" width="400" height="156" rx="10"/><text class="tag" x="52" y="62">01 · TARGET DATA</text><text class="t" x="52" y="91">서울 생활인구 · 250m 격자</text><text class="s" x="52" y="116">2023.09.21 — 2026.09.20 · 1,096일</text><text class="s" x="52" y="139">5개 후보 권역 · 시간대별 추정 체류인구</text><text class="s" x="52" y="163">정답값: 전체 인구 + 20~39세 인구 (별도 모델)</text>
<rect class="panel" x="480" y="35" width="400" height="156" rx="10"/><text class="tag" x="504" y="62">02 · WEATHER FEATURES</text><text class="t" x="504" y="91">과거 예보모델 날씨</text><text class="s" x="504" y="116">Open-Meteo 과거 예보 아카이브</text><text class="s" x="504" y="139">기온 · 강수량 · 풍속을 시간별로 결합</text><text class="s" x="504" y="163">기상청 관측값이 아닌 예보모델 자료</text>
<rect class="panel" x="932" y="35" width="400" height="156" rx="10"/><text class="tag" x="956" y="62">03 · CALENDAR &amp; AREA</text><text class="t" x="956" y="91">달력·권역 변수</text><text class="s" x="956" y="116">월·요일·시간 · 계절 주기</text><text class="s" x="956" y="139">주말 · 공휴일 · 휴일 전날 · 임시공휴일</text><text class="s" x="956" y="163">권역 대리값: 홍대·잠실·명동·성수·용산</text>
<!-- converge -->
<path class="line" d="M228 191 V228 H680 V253"/><path class="line" d="M680 191 V253"/><path class="line" d="M1132 191 V228 H680"/>
<rect class="softbox" x="480" y="253" width="400" height="77" rx="9"/><text class="tag" text-anchor="middle" x="680" y="278">04 · TRAINING TABLE</text><text class="t" text-anchor="middle" x="680" y="303">권역 × 날짜 × 시간</text><text class="s" text-anchor="middle" x="680" y="321">131,520행 · 입력 변수와 실제 생활인구를 같은 시점에 정렬</text>
<path class="line" d="M680 330 V356 H340 V379"/><path class="line" d="M680 356 H1020 V379"/>
<!-- parallel target model groups -->
<rect class="panel" x="28" y="379" width="624" height="209" rx="10"/><text class="tag" x="52" y="406">05A · TOTAL POPULATION</text><text class="t" x="52" y="432">전체 생활인구 예측</text>
<rect class="node" x="52" y="449" width="120" height="64" rx="6"/><text class="t" text-anchor="middle" x="112" y="475" font-size="13">기준선</text><text class="tiny" text-anchor="middle" x="112" y="497">요일·시간 중앙값</text><text class="tiny" text-anchor="middle" x="112" y="508">(ML 아님)</text>
<rect class="node" x="190" y="449" width="210" height="64" rx="6"/><text class="t" text-anchor="middle" x="295" y="473" font-size="12">Poisson 평균 회귀</text><text class="tiny" text-anchor="middle" x="295" y="493">sklearn HistGradientBoostingRegressor</text><text class="tiny" text-anchor="middle" x="295" y="506">loss=poisson</text>
<rect class="focal" x="420" y="449" width="208" height="64" rx="6"/><text class="t" text-anchor="middle" x="524" y="473" font-size="12">분위수 회귀 Q10·50·90</text><text class="tiny" text-anchor="middle" x="524" y="493">sklearn HistGradientBoostingRegressor</text><text class="tiny" text-anchor="middle" x="524" y="506">loss=quantile · quantile=0.1/0.5/0.9</text>
<text class="s" x="52" y="546">학습 정답: 해당 권역의 시간대별 전체 생활인구</text><text class="tiny" x="52" y="567">팝업 입장객 수나 매출을 직접 예측하는 모델은 아닙니다.</text>
<rect class="panel" x="708" y="379" width="624" height="209" rx="10"/><text class="tag" x="732" y="406">05B · AGE 20–39 POPULATION</text><text class="t" x="732" y="432">20~39세 생활인구 예측</text>
<rect class="node" x="732" y="449" width="120" height="64" rx="6"/><text class="t" text-anchor="middle" x="792" y="475" font-size="13">기준선</text><text class="tiny" text-anchor="middle" x="792" y="497">요일·시간 중앙값</text><text class="tiny" text-anchor="middle" x="792" y="508">(ML 아님)</text>
<rect class="node" x="870" y="449" width="210" height="64" rx="6"/><text class="t" text-anchor="middle" x="975" y="473" font-size="12">Poisson 평균 회귀</text><text class="tiny" text-anchor="middle" x="975" y="493">sklearn HistGradientBoostingRegressor</text><text class="tiny" text-anchor="middle" x="975" y="506">loss=poisson</text>
<rect class="focal" x="1100" y="449" width="208" height="64" rx="6"/><text class="t" text-anchor="middle" x="1204" y="473" font-size="12">분위수 회귀 Q10·50·90</text><text class="tiny" text-anchor="middle" x="1204" y="493">sklearn HistGradientBoostingRegressor</text><text class="tiny" text-anchor="middle" x="1204" y="506">loss=quantile · quantile=0.1/0.5/0.9</text>
<text class="s" x="732" y="546">학습 정답: 20~24·25~29·30~34·35~39세 인구 합계</text><text class="tiny" x="732" y="567">전체 인구와 별도로 학습해 타깃 연령 인원 범위를 산출합니다.</text>
<!-- converge to validation -->
<path class="line" d="M340 588 V610 H680 V625"/><path class="line" d="M1020 588 V610 H680"/>
<rect class="softbox" x="28" y="625" width="542" height="57" rx="8"/><text class="tag" x="48" y="648">06 · TIME-AWARE EVALUATION</text><text class="s" x="48" y="669">과거 최대 22주 순차 검증 + 2026.09.14–20 최종 테스트</text>
<rect class="focal" x="594" y="615" width="268" height="77" rx="9"/><text class="tag" text-anchor="middle" x="728" y="638">OUTPUT</text><text class="t" text-anchor="middle" x="728" y="662">후보별 시간대 인원 범위</text><text class="tiny" text-anchor="middle" x="728" y="680">Q10 · Q50 · Q90 분위수별 모델 3개</text>
<rect class="softbox" x="886" y="625" width="446" height="57" rx="8"/><text class="tag" x="906" y="648">07 · MODEL CHECK</text><text class="s" x="906" y="669">롤링 검증은 분위수 모델 우세, 최종 주는 기준선 우세</text>
</svg>
<footer class="foot"><span><strong>모델 입력 전처리:</strong> 권역은 OneHotEncoder, 숫자 결측은 중앙값 대체. 생활인구는 팝업 입장객이 아닌 체류인구 추정치입니다.</span><span><strong>설정:</strong> scikit-learn · 120회 반복 · 잎 노드 최대 15 · L2=1 · random_state=42</span></footer>
</section></main></body></html>
